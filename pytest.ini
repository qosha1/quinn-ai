[pytest]
# Primary test paths for quinnai
# - tests/: Integration tests, shared module tests (pyterm, beads, example_orgs)
# - cli/tests/: CLI command and service tests
# - tests/e2e/: End-to-end smoke tests for CLI commands
testpaths = tests cli/tests tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Ignore subdirectories with their own test configurations:
# - backend/: Django tests, runs separately via CI test-backend job
# - terminal-app/: Textual UI tests, has separate conftest with different sys.path
# - e2e/: End-to-end browser tests (Playwright), run via separate e2e workflow
# - cli/beads-org/integrations/beads-mcp/: MCP server tests with separate dependencies
# Note: tests/e2e/ (CLI smoke tests) is NOT ignored, only root e2e/ (browser tests)
addopts = --ignore=backend --ignore=terminal-app --ignore=e2e --ignore=cli/beads-org/integrations/beads-mcp
# Default timeout per test (30 seconds) to prevent hanging tests
timeout = 30
