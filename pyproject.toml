[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quinnai"
version = "0.1.0"
description = "QuinnAI - RollerCoaster Tycoon for AI Organizations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "QuinnAI Team" }
]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "systemeval[pytest]>=0.3.0",
]

[project.scripts]
qn = "cli.commands.main:qn"

[tool.hatch.build.targets.wheel]
packages = ["cli", "shared"]

# NOTE: Pytest configuration lives in pytest.ini (single source of truth)
# pyproject.toml [tool.pytest.ini_options] is intentionally omitted to avoid conflicts.
# Run: pytest (uses pytest.ini) or systemeval test (uses pytest adapter with pytest.ini)
