[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quinnai"
version = "0.2.0"
description = "QuinnAI - RollerCoaster Tycoon for AI Organizations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "QuinnAI Team" }
]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.3.0",
    "systemeval[pytest]>=0.3.0",
]

[project.scripts]
qn = "cli.commands.main:qn"
qn-bd = "cli.commands.qn_bd:main"
msgr = "cli.msgr.main:msgr"

[tool.hatch.build.targets.wheel]
packages = ["cli", "shared"]
exclude = [
  # The bd binary is treated as a system dependency (install via Homebrew /
  # apt / etc); see bd_wrapper.get_bundled_bd_path. Excluding cli/bin/* keeps
  # the wheel small and platform-neutral.
  "cli/bin/**",
]

# NOTE: Pytest configuration lives in pytest.ini (single source of truth)
# pyproject.toml [tool.pytest.ini_options] is intentionally omitted to avoid conflicts.
# Run: pytest (uses pytest.ini) or systemeval test (uses pytest adapter with pytest.ini)
