name: Validate Workflows

# This workflow validates the syntax of all workflow files
# Runs on changes to workflow files to catch YAML syntax errors early

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    paths:
      - '.github/workflows/**'

jobs:
  validate:
    name: Validate Workflow Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow files
        run: |
          echo "Checking YAML syntax of workflow files..."

          for workflow in .github/workflows/*.yml; do
            echo "Validating $workflow"
            python3 -c "import yaml; yaml.safe_load(open('$workflow'))" || exit 1
          done

          echo "All workflow files are valid YAML"

      - name: Check for common issues
        run: |
          echo "Checking for common workflow issues..."

          # Check for tabs (YAML requires spaces)
          if grep -P '\t' .github/workflows/*.yml; then
            echo "Error: Tabs found in workflow files. Use spaces only."
            exit 1
          fi

          echo "No common issues found"
