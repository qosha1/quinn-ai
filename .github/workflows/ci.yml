name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION_MIN: '3.11'
  PYTHON_VERSION_MAX: '3.12'
  GO_VERSION: '1.21'

jobs:
  # Lint job runs on all triggers - fast feedback on code quality
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy django-stubs djangorestframework-stubs

      - name: Run ruff check
        run: |
          ruff check backend/ --config backend/pyproject.toml

      - name: Run black check
        run: |
          black --check backend/ --config backend/pyproject.toml

      - name: Run mypy
        run: |
          cd backend
          mypy apps/ --config-file pyproject.toml || true
        # Note: mypy errors are non-blocking for now (|| true)
        # Remove || true once type coverage is improved

  # Test job runs on all triggers (PR, push to main, release tags)
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest_output.txt
          retention-days: 7

  # Backend tests (Django)
  test-backend:
    name: Test Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/local.txt

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest apps/ -v --tb=short
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-py${{ matrix.python-version }}
          path: backend/pytest_output.txt
          retention-days: 7

  # Build beads binaries (only on main branch or release tags)
  build-beads:
    name: Build Beads (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, test, test-backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            os: darwin
            arch: arm64
          - platform: darwin-amd64
            runner: macos-latest
            os: darwin
            arch: amd64
          - platform: linux-amd64
            runner: ubuntu-latest
            os: linux
            arch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build beads binary
        run: |
          chmod +x ./scripts/build-beads.sh
          # Build to platform-specific directory
          mkdir -p cli/bin/${{ matrix.platform }}
          PLATFORM=${{ matrix.os }} ARCH=${{ matrix.arch }} ./scripts/build-beads.sh
          # Move to platform directory
          mv cli/bin/bd cli/bin/${{ matrix.platform }}/bd
        env:
          BEADS_VERSION: '0.46.0'

      - name: Verify binary
        run: |
          BINARY_PATH="cli/bin/${{ matrix.platform }}/bd"
          if [ -f "$BINARY_PATH" ]; then
            chmod +x "$BINARY_PATH"
            file "$BINARY_PATH"
            ls -lh "$BINARY_PATH"
          else
            echo "Binary not found at $BINARY_PATH"
            exit 1
          fi

      - name: Upload beads artifact
        uses: actions/upload-artifact@v4
        with:
          name: beads-${{ matrix.platform }}
          path: cli/bin/${{ matrix.platform }}/bd
          retention-days: 7
          if-no-files-found: error

  # Build Python wheels (one per platform, only on main branch or release tags)
  build-python:
    name: Build Python Package (${{ matrix.platform }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-beads
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            wheel_tag: macosx_11_0_arm64
          - platform: darwin-amd64
            wheel_tag: macosx_10_15_x86_64
          - platform: linux-amd64
            wheel_tag: manylinux_2_17_x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_MAX }}
          cache: 'pip'

      - name: Download beads artifact for platform
        uses: actions/download-artifact@v4
        with:
          name: beads-${{ matrix.platform }}
          path: cli/bin/

      - name: Prepare binary
        run: |
          chmod +x cli/bin/bd
          echo "Binary for ${{ matrix.platform }}:"
          file cli/bin/bd
          ls -lh cli/bin/bd

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel hatchling

      - name: Build wheel
        run: |
          python -m build --wheel .

      - name: Rename wheel with platform tag
        run: |
          cd dist
          # Rename generic wheel to platform-specific
          for wheel in *.whl; do
            new_name=$(echo "$wheel" | sed 's/py3-none-any/py3-none-${{ matrix.wheel_tag }}/')
            mv "$wheel" "$new_name"
          done
          ls -lh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.platform }}
          path: dist/*.whl
          retention-days: 30
          if-no-files-found: error

  # Publish release (only on version tags)
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-python]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Python wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist/
          merge-multiple: true

      - name: Download beads binaries
        uses: actions/download-artifact@v4
        with:
          pattern: beads-*
          path: beads-binaries/

      - name: List artifacts
        run: |
          echo "=== Python wheels ==="
          ls -lh dist/
          echo ""
          echo "=== Beads binaries ==="
          find beads-binaries/ -type f -exec ls -lh {} \;

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.whl
            beads-binaries/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: success()
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          skip-existing: true
          verbose: true
