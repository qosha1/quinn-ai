version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: saas-postgres-local
    volumes:
      - saas-postgres-data:/var/lib/postgresql/data
    env_file:
      - ./.envs/.local/.postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache and Celery Broker
  redis:
    image: redis:7-alpine
    container_name: saas-redis-local
    volumes:
      - saas-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend API
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    container_name: saas-django-local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    container_name: saas-celery-worker-local
    depends_on:
      - redis
      - postgres
      - django
    volumes:
      - ./backend:/app
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    command: celery -A config worker --loglevel=info

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    container_name: saas-celery-beat-local
    depends_on:
      - redis
      - postgres
      - django
    volumes:
      - ./backend:/app
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    command: celery -A config beat --loglevel=info

  # Landing Page (NextJS)
  landing:
    build:
      context: ./landing
      dockerfile: ../compose/local/node/Dockerfile
    container_name: saas-landing-local
    volumes:
      - ./landing:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # App Dashboard (NextJS)
  app:
    build:
      context: ./app
      dockerfile: ../compose/local/node/Dockerfile
    container_name: saas-app-local
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3001:3000"
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    build:
      context: .
      dockerfile: ./compose/local/nginx/Dockerfile
    container_name: saas-nginx-local
    depends_on:
      - django
      - landing
      - app
    ports:
      - "80:80"
    volumes:
      - ./compose/local/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  saas-postgres-data:
    name: saas-postgres-data
  saas-redis-data:
    name: saas-redis-data
