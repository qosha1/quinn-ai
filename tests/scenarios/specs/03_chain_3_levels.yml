name: chain_3_levels
setup:
  init:
    ceo_name: Alice
    ceo_role: CEO
ops:
  - { op: hire, name: Bob, role: Manager, manager: ceo, cost: 100 }
  - { op: delegate_authority, to: bob, level: team-lead, budget: 200, max_reports: 5 }
  - { op: hire, name: Carol, role: engineer, manager: bob, cost: 50 }
assertions:
  - { kind: worker_count, value: 3 }
  - { kind: org_chart_depth, value: 3 }
  - { kind: manager_subordinates, manager: bob, expected: [carol] }
