name: okr_cascade
setup:
  init:
    ceo_name: Alice
ops:
  - { op: hire, name: Bob, role: engineer, manager: ceo, cost: 100 }
  - { op: create_okr, objective: "Ship feature X", owner: ceo, id_var: ship_x_id }
  - { op: assign_kr, okr: ship_x_id, kr: features_shipped, target: 5 }
assertions:
  - { kind: okr_owner, okr: ship_x_id, expected: ceo }
