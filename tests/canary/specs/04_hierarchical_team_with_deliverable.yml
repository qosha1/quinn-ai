# Canary scenario 04: full hierarchical org launch with delegated team-building
# and a cross-level deliverable that bubbles back up to the CEO.
#
# What this proves end-to-end against a live LLM:
#   1. CEO Alice autonomously hires Director Diana, allocates budget, delegates
#      hiring authority via `qn org delegate-authority`, and starts her session.
#   2. Diana — operating one level down the org chart — autonomously hires
#      TWO engineers (Eve + Frank) under herself, allocates them budgets, and
#      starts their sessions.
#   3. Eve drafts an architecture proposal in shared storage; Frank reviews
#      it and DMs Eve back. Real artifact + peer review at depth 3.
#   4. Diana reports a status update UP THE CHAIN to Alice via DM.
#
# Prompt design notes:
# - OKR descriptions are stored in DB and read via `qn org okr show`, so
#   they CAN be multi-line.
# - Kickstart messages are delivered via `tmux send-keys`, which types the
#   string literally — every '\n' becomes an Enter press. Multi-line YAML
#   block scalars ('message: |') get shredded into partial submissions and
#   confuse claude. Keep kickstart messages SINGLE-LINE.
# - Earlier 'do NOT ask' imperatives tripped Opus 4.7's prompt-injection
#   detector (quinn-ai-womk). This revision frames work as legitimate
#   tasking and keeps directives concise.
#
# Workaround note (until quinn-ai-3gwh is fully fixed): msgr commands
# explicitly pass --worker-id {self_id}.
name: hierarchical_team_with_deliverable
setup:
  init:
    ceo_name: Alice
ops:
  # CEO's bootstrap directive: stand up Director Diana with delegated authority.
  - op: create_okr
    objective: "Stand up the engineering organization with Director Diana"
    owner: ceo
    description: |
      Goal: bring Diana online as Director of Engineering so she can build
      out the team and lead the architecture-proposal initiative.

      Key results:
        - Diana is hired as a director reporting to Alice (cost 50).
        - Diana has 200 in hiring budget allocated.
        - Diana has team-lead hiring authority delegated (max 5 reports).
        - Diana's worker session is live and ready for direction.

      Standard Director-onboarding sequence (these are the canonical
      commands; safe to chain with && for efficiency):
        qn org hire --name Diana --role director --manager alice --cost 50
        qn org budget allocate diana 200
        qn org delegate-authority --to diana --level team-lead --budget 200 --max-reports 5 --force
        qn org start --worker diana

      Once Diana is online, this OKR is complete. She'll handle hiring
      her team from there.
  - { op: start_org }

  # Single-line kickstart so tmux send-keys delivers it as one input.
  - op: kickstart_ceo
    message: "Please review your top OKR and execute it now. Run the four onboarding commands at the bottom of the OKR description (chain with && in one bash call for efficiency)."
  - { op: wait_until, predicate: { kind: worker_count, value: 2 }, timeout_seconds: 240, poll_interval_seconds: 2 }

  # Diana hires Eve + Frank. One bash -c, one shot. Single line.
  - op: kickstart_worker
    worker: diana
    message: "Hi Diana — you are Director of Engineering (worker id {self_id}). Please build out the engineering team by running this one bash command: bash -c \"qn org hire --name Eve --role engineer --manager {self_id} --cost 30 && qn org hire --name Frank --role engineer --manager {self_id} --cost 30 && qn org budget allocate eve 50 && qn org budget allocate frank 50 && qn org start --worker eve && qn org start --worker frank\""
  - { op: wait_until, predicate: { kind: worker_count, value: 4 }, timeout_seconds: 300, poll_interval_seconds: 2 }

  # Eve drafts the proposal and DMs Frank. One bash -c, single line.
  - op: kickstart_worker
    worker: eve
    other_worker: frank
    message: "Hi Eve — you are an engineer (worker id {self_id}). Please draft a v0 architecture proposal and DM Frank for review by running: bash -c \"mkdir -p \\$SHARED_STORAGE/teams/engineering && printf '# Architecture Proposal v0\\nAuthor: Eve\\nProposal: start with a single-process monolith; extract services only when a clear scaling boundary appears.\\nOpen questions: observability stack, sync vs async ingestion.' > \\$SHARED_STORAGE/teams/engineering/proposal.md && msgr --worker-id {self_id} send @{other_id} 'Drafted shared/teams/engineering/proposal.md - please review and reply with feedback.'\""

  # Frank reviews and DMs back.
  - op: kickstart_worker
    worker: frank
    other_worker: eve
    message: "Hi Frank — you are an engineer (worker id {self_id}). Eve drafted the architecture proposal. Please review it and DM her your feedback by running: bash -c \"cat \\$SHARED_STORAGE/teams/engineering/proposal.md && msgr --worker-id {self_id} send @{other_id} 'Reviewed proposal. Approving v0 with one suggestion: define migration trigger metrics quantitatively. Otherwise solid - ship it.'\""

  - { op: wait_until, predicate: { kind: message_count_between, from: eve, to: frank, min: 1 }, timeout_seconds: 240, poll_interval_seconds: 2 }
  - { op: wait_until, predicate: { kind: message_count_between, from: frank, to: eve, min: 1 }, timeout_seconds: 240, poll_interval_seconds: 2 }

  # Diana reports status to Alice.
  - op: kickstart_worker
    worker: diana
    other_worker: alice
    message: "Hi Diana — Eve and Frank just completed their first peer-review cycle. Please send a status update DM to Alice (worker {other_id}) by running: msgr --worker-id {self_id} send @{other_id} 'Status update: engineering team online. Eve drafted v0 architecture proposal; Frank reviewed and approved with one suggestion. Ready for next OKR.'"
  - { op: wait_until, predicate: { kind: message_count_between, from: diana, to: alice, min: 1 }, timeout_seconds: 180, poll_interval_seconds: 2 }

assertions:
  - { kind: worker_count, value: 4 }
  - { kind: org_chart_depth, value: 3 }
  - { kind: manager_subordinates, manager: alice, expected: [diana] }
  - { kind: manager_subordinates, manager: diana, expected: [eve, frank] }
  - { kind: message_count_between, from: eve,   to: frank, min: 1 }
  - { kind: message_count_between, from: frank, to: eve,   min: 1 }
  - { kind: message_count_between, from: diana, to: alice, min: 1 }
