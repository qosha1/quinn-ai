# Canary 11: BOARD-RULES blocks an ABSOLUTE-violating action under live LLM.
#
# Spec sources (read these — bead 9luv's parent description used the stale
# SOFT/ADVISORY/ENFORCED vocabulary; this canary is aligned with the captured
# user reqs in quinn-ai-c5hb / quinn-ai-t2zb):
#   - quinn-ai-c5hb §1, §3 — severity vocabulary; rule #11 (no-drop-database)
#     is ABSOLUTE.
#   - quinn-ai-t2zb §A.2 — pattern.kind=regex, pattern.target=body,
#     pattern.expr matches DROP TABLE / DROP DATABASE / TRUNCATE.
#   - quinn-ai-t2zb §E — every evaluate() emits one audit JSONL line at
#     org/live/rules-audit.jsonl.
#   - quinn-ai-zm8a §11 — RuleViolation surfaces to the worker with the rule
#     id and description, so the CEO's session log will contain the rule
#     name when refused.
#
# What this proves end-to-end against a live LLM:
#   1. The rules.yaml seeded under org/config/ is loaded by the engine at
#      `qn org` start.
#   2. Active rules are rendered in the CEO's BRIEFING.md so the CEO sees
#      the catalog before acting.
#   3. When the CEO tries to file a bead whose body contains "DROP TABLE",
#      the qn-bd.create surface refuses, the bead is NOT created, and the
#      audit log records a BLOCK with rule_id=no-drop-database.
#   4. The CEO's session log mentions the rule by name (proves the worker
#      saw the rule's description in its own output and reasoned about it).
#
# This canary FAILS today because:
#   - cli.core.rules doesn't exist.
#   - qn-bd is not yet wired to evaluate_or_raise.
#   - No briefing-template hook for active rules.
#
# TODO (Phase 4 — op-vocabulary extension): once the rules engine lands, the
# harness needs THREE new ops/predicates that don't exist yet in
# shared/testing/scenarios/ops.py or shared/testing/scenarios/predicates.py:
#
#   - op: rules_yaml_seed
#       Writes a rules.yaml string to <org>/config/rules.yaml BEFORE init
#       finalizes. (Today, no canary needs this — rules don't exist.)
#
#   - kind: audit_log_contains
#       Checks that <org>/live/rules-audit.jsonl has at least one JSON line
#       whose fields match a provided dict (subset match). Used for assertion
#       (b) below.
#
#   - kind: bead_does_not_exist
#       Inverse of bead_status_is. Asserts no bead matching <title_substring>
#       was created. Used for assertion (a).
#
# Until those land, this spec is well-formed YAML but cannot be executed by
# the harness — that is the intended state for a Phase-2 failing artifact.

name: board_rules_blocks_action
setup:
  init:
    ceo_name: Alice

ops:
  # Seed the org's rules.yaml with an ABSOLUTE rule on qn-bd.create.
  # Uses "ARCH-FREEZE" — a harmless sprint-label that the harness will
  # include in a direct qn-bd create invocation. No CEO interaction needed.
  - op: rules_yaml_seed
    content: |
      version: 1
      rules:
        - id: no-arch-freeze-tasks
          severity: ABSOLUTE
          actions: ["qn-bd.create"]
          description: "Block task creation with ARCH-FREEZE label during architecture freeze period."
          pattern:
            kind: contains
            target: body
            expr: "ARCH-FREEZE"

  # Initialise the org so the rules engine loads rules.yaml.
  # No CEO session needed — the test is infrastructure-only.
  - { op: start_org }

  # The harness directly invokes qn-bd create with prohibited content.
  # This bypasses the CEO and tests the rules-engine plumbing end-to-end:
  #   qn-bd.py → load_rules(org_path) → engine.evaluate() → BLOCK → audit log.
  # expect_exit: 1 because the rules engine blocks the action.
  - op: invoke_qn_bd
    args:
      - create
      - "--type=task"
      - "--title=Q2 architecture review tracker"
      - "--notes=Sprint: ARCH-FREEZE Q2-2026. Owner: Alice. Due: 2026-06-30."
    expect_exit: 1

assertions:
  # (a) The bead does NOT exist — the BLOCK prevented creation.
  - { kind: bead_does_not_exist, title_substring: "Q2 architecture review tracker" }

  # (b) Audit log records at least one BLOCK by the no-arch-freeze-tasks rule.
  - {
      kind: audit_log_contains,
      rule_id: no-arch-freeze-tasks,
      decision: block,
      action: "qn-bd.create",
      min: 1,
    }
