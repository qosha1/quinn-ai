# Canary 09: competing priorities AND scale — CEO must defend a tradeoff
# AND staff the chosen path properly.
#
# What this proves (and prior canaries don't):
#   - The CEO is given TWO simultaneous P0s. There is NO prescribed answer
#     for which to ship — they pick, document the call, and defend it.
#   - The CHOSEN P0 (whichever it is) is genuinely large: 4 deliverables
#     spanning 4 skillsets (Engineer / QA / Marketing-comms / Writer).
#     Solo execution is physically infeasible in the SLA window.
#   - Combined with the new "decompose by vertical and skillset" guidance
#     in BRIEFING.md (cli/config/templates/briefing.md.jinja2), this
#     forces real delegation rather than first-person execution.
#   - The deferred P0 still needs a real handoff (owner + when).
#
# What we explicitly do NOT prescribe:
#   - Which P0 to ship (the four deliverable file paths are the same;
#     content differs by chosen P0).
#   - Specific worker names.
#   - The exact writing or implementation form.
#
# Cost expectation: ~$1.50–2.50 per run (4 hires + 4 deliverables).
name: competing_priorities
setup:
  init:
    ceo_name: Alice
ops:
  # Plant both P0s up front so the CEO can reference / close / defer them.
  - op: create_bead
    title: "P0-AUTH: SQL-injection in /v1/login parameter handling"
    type: bug
    priority: 0
    id_var: sec_id

  - op: create_bead
    title: "P0-DEMO: ship CSV export endpoint before tomorrow's customer demo"
    type: feature
    priority: 0
    id_var: demo_id

  # OKR carries the full situation. Outcome-only — no command list.
  - op: create_okr
    objective: "Make a defended call between P0-AUTH and P0-DEMO; ship one, hand off the other"
    owner: ceo
    description: |
      Situation
      =========
      Two P0 issues just landed at the same time. Both are real, both have
      real stakeholders, and there is not enough budget or time today to
      do both well.

      P0-AUTH (security / compliance)
      -------------------------------
      A SQL-injection vulnerability has been confirmed in /v1/login.
      Compliance wants a documented patch within today's working window.
      Customer data is not currently leaking but the path is open.

      Shipping this P0 fully requires FOUR distinct deliverables, each
      a different specialty — you cannot serially write all of these
      yourself in the SLA window:

        1. /tmp/canary09-prioritized.py — Python module with a
           parameterized-query fix for the vulnerable login. NO string
           concatenation or f-strings building SQL from user input.
           Owned by an Engineer. Must include a smoke test that rejects
           classic injection payloads.
        2. /tmp/canary09-tests.py — pytest suite proving the fix.
           At least 3 `def test_*` cases with `assert`s, including the
           regression for the original injection. Owned by QA.
        3. /tmp/canary09-advisory.md — customer-facing security
           advisory. Public-statement voice, no engineering jargon.
           Tells customers what was at risk, what was fixed, what to
           do. Owned by a Marketing / Communications specialist.
        4. /tmp/canary09-postmortem.md — internal compliance
           postmortem. Must include the strings "root cause" and
           "mitigation". Owned by a Security / Compliance writer (or
           senior engineer doing the writeup — different person from
           the one who wrote the patch, so the fix is independently
           summarized).

      P0-DEMO (sales / customer)
      --------------------------
      The biggest prospect's procurement team is reviewing tomorrow at
      10am. They asked for CSV export of /v1/orders. If the demo
      doesn't show this working, the deal slips a quarter.

      Shipping this P0 fully also requires FOUR distinct deliverables
      from different specialties:

        1. /tmp/canary09-prioritized.py — Python module with a
           function converting a list of order dicts into a valid CSV
           string (header row + ≥1 body row). Owned by an Engineer.
        2. /tmp/canary09-tests.py — pytest suite for the export.
           ≥3 `def test_*` cases with `assert`s covering the header,
           a body row, and an edge case (commas/quotes/newlines).
           Owned by QA.
        3. /tmp/canary09-advisory.md — customer-facing API doc /
           release note for the new export. Customer voice, includes a
           short usage example. Owned by Marketing / Communications.
        4. /tmp/canary09-postmortem.md — internal demo-readiness
           writeup. Must include "root cause" (why we didn't have
           this earlier) and "mitigation" (what we built). Owned by
           a separate writer / senior engineer.

      Note on file paths: whichever P0 you pick, the FOUR file paths
      are the same — the CONTENT differs based on which P0 wins.

      Hard volume reality
      ===================
      Four distinct artifacts in four distinct specialty voices is NOT
      something one person can serially produce at quality in the
      SLA window. The work is large enough that solo execution is the
      wrong shape — you need at least one Engineer, one QA, one
      Marketing/Comms specialist, and one Writer (or a senior eng
      doing the writeup). Per your briefing's "decompose by vertical
      and skillset" rule, this is a 4-skillset job and must be hired.

      Budget reality
      ==============
      You have generous budget. Hiring 4 specialists fits well within
      it. Not hiring is the failure mode — it caps the org at one
      person's bandwidth and quality bar.

      What we need from you (CEO)
      ===========================
      1. Decide WHICH P0 ships today. The other defers. Document the
         call in /tmp/canary09-decision.md. The memo must:
           - Reference BOTH P0-AUTH and P0-DEMO by name.
           - State which one ships and which defers.
           - Give substantive reasoning (cost, risk, customer impact).
             Words like "because", "given", "however", or "since"
             should appear naturally as you defend the call.
      2. **Hire the team for the chosen P0**. The chosen P0 has FOUR
         skillsets of work — Engineer, QA, Marketing/Comms, and
         Writer (or senior eng doing the writeup). Hire ≥3 specialists
         (you don't have to hire all 4 if one person can plausibly
         own two adjacent cells, but solo execution is not viable).
         Use `qn org hire --name=... --role="Engineer"` etc. Give each
         hire the role that matches their cell.
      3. Delegate the four deliverables to the right specialists.
         Each artifact's voice should reflect its owner's specialty —
         the engineer's code reads like code, the marketing advisory
         reads like customer comms, the postmortem reads like an
         internal writeup, etc.
      4. Broadcast the tradeoff to #general so stakeholders know what
         to expect today vs. tomorrow.
      5. The DEFERRED P0 gets a handoff doc at /tmp/canary09-deferred.md
         that names an owner (worker name or role) and an approximate
         timeframe. Don't close the deferred bead — leave it open so
         the handoff target can claim it.

      Stakeholder context
      ===================
      Both Compliance and Sales know this is a hard call. They are not
      expecting both today. They ARE expecting a defended decision, a
      properly staffed execution of the chosen P0, and a clean handoff
      for whichever side waits.

  - { op: start_org }
  - op: kickstart_ceo
    message: "Two P0s landed at once. Read the OKR — both P0s require FOUR skillsets each (Engineer, QA, Marketing/Comms, Writer). You cannot ship either alone in the SLA window. Pick which P0 ships, write /tmp/canary09-decision.md (mention both P0s, defend the call), then HIRE your team (≥3 specialists for the chosen P0) and delegate the four deliverables. Broadcast tradeoff to #general. Write /tmp/canary09-deferred.md handoff for the deferred P0."

  # Phase 1: CEO must hire the team. ≥4 workers (CEO + 3 specialists)
  # because the chosen P0 has 4 skillsets of work. Solo execution is
  # the failure mode this canary catches.
  - { op: wait_until, predicate: { kind: worker_count, min: 4 }, timeout_seconds: 300, poll_interval_seconds: 5 }

  # Phase 2: decision memo names BOTH P0s — proves CEO didn't rubber-stamp.
  - { op: wait_until, predicate: { kind: file_contains, path: /tmp/canary09-decision.md, substring: "P0-AUTH" }, timeout_seconds: 240, poll_interval_seconds: 5 }
  - { op: wait_until, predicate: { kind: file_contains, path: /tmp/canary09-decision.md, substring: "P0-DEMO" }, timeout_seconds: 240, poll_interval_seconds: 5 }

  # Phase 3: each of the four chosen-P0 deliverables lands. Substrings
  # accept either P0's expected content shape.
  - op: wait_until
    predicate:
      kind: file_contains_any
      path: /tmp/canary09-prioritized.py
      substrings: ["parameterized", "cursor.execute", "placeholder", "csv", "writer", "writerow"]
      case_insensitive: true
    timeout_seconds: 480
    poll_interval_seconds: 5
  - { op: wait_until, predicate: { kind: file_contains, path: /tmp/canary09-tests.py, substring: "def test_" }, timeout_seconds: 480, poll_interval_seconds: 5 }
  - op: wait_until
    predicate:
      kind: file_contains_any
      path: /tmp/canary09-advisory.md
      substrings: ["customers", "we are", "today", "we have identified", "release", "available"]
      case_insensitive: true
    timeout_seconds: 480
    poll_interval_seconds: 5
  - { op: wait_until, predicate: { kind: file_contains, path: /tmp/canary09-postmortem.md, substring: "root cause" }, timeout_seconds: 480, poll_interval_seconds: 5 }

  # Phase 4: handoff doc for the deferred P0.
  - { op: wait_until, predicate: { kind: file_contains, path: /tmp/canary09-deferred.md, substring: "" }, timeout_seconds: 240, poll_interval_seconds: 5 }

assertions:
  # CEO hired a real team. The chosen P0 has 4 skillsets of work; solo
  # execution is the failure mode this canary catches. ≥4 workers means
  # CEO + ≥3 specialists.
  - { kind: worker_count, min: 4 }

  # Specialty diversity in the staffing. Whichever P0 won, the team must
  # include at least one Engineer-shaped role and at least one
  # Marketing/Comms-shaped role (because every chosen-P0 deliverable set
  # spans those two specialties at minimum).
  - kind: worker_role_contains
    substrings: ["engineer", "developer", "eng"]
    min: 1
    exclude_ceo: true
  - kind: worker_role_contains
    substrings: ["marketing", "comms", "communications", "writer", "pr"]
    min: 1
    exclude_ceo: true

  # Decision memo names BOTH P0s and reads like a defended call.
  - { kind: file_contains, path: /tmp/canary09-decision.md, substring: "P0-AUTH" }
  - { kind: file_contains, path: /tmp/canary09-decision.md, substring: "P0-DEMO" }
  - kind: file_contains_any
    path: /tmp/canary09-decision.md
    substrings: ["because", "given", "since", "however", "tradeoff", "trade-off", "rationale"]
    case_insensitive: true

  # All four chosen-P0 deliverables shipped. Either P0's content shape is OK.
  - kind: file_contains_any
    path: /tmp/canary09-prioritized.py
    substrings: ["parameterized", "cursor.execute", "placeholder", "csv", "writer", "writerow"]
    case_insensitive: true
  - { kind: file_contains, path: /tmp/canary09-tests.py, substring: "def test_" }
  - { kind: file_contains, path: /tmp/canary09-tests.py, substring: "assert" }
  - kind: file_contains_any
    path: /tmp/canary09-advisory.md
    substrings: ["customers", "we are", "today", "we have identified", "release", "available", "service"]
    case_insensitive: true
  - { kind: file_contains, path: /tmp/canary09-postmortem.md, substring: "root cause" }
  - { kind: file_contains, path: /tmp/canary09-postmortem.md, substring: "mitigation" }

  # Deferred handoff names an owner / role and a rough timeframe.
  - kind: file_contains_any
    path: /tmp/canary09-deferred.md
    substrings: ["owner", "assigned", "handoff", "tomorrow", "after", "next", "pick up", "engineer", "specialist"]
    case_insensitive: true
