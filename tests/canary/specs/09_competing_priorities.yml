# Canary 09: competing priorities under hard budget pressure.
#
# What this proves (and prior canaries don't):
#   - The CEO is given TWO simultaneous P0s that genuinely cannot both be
#     fully resourced. Budget + time make it physically impossible. There
#     is NO right answer — just a defensible one.
#   - We do not prescribe which P0 wins. The CEO picks, documents the
#     choice, and defends it in writing. Assertions check that the
#     tradeoff was made and documented — not which way it went.
#   - The deferred P0 must have a real handoff (owner + when), not just
#     "we'll get to it." Tests that the CEO actually closes the loop on
#     work they're choosing not to do today.
#
# What we explicitly do NOT prescribe:
#   - Which P0 to ship.
#   - How many people to hire (only that ≥1 hire happens — solo execution
#     under this kind of pressure is the failure mode we want to flush out).
#   - The specific writing or implementation form.
#
# Specialty hint vs canary 07/08: canary 09 is about JUDGMENT, not
# diversity. A single capable engineer could plausibly do this — the test
# is whether the CEO can resist the temptation to do everything and
# instead delegate + defend a tradeoff.
#
# Cost expectation: ~$0.80–1.30 per run.
name: competing_priorities
setup:
  init:
    ceo_name: Alice
ops:
  # Plant both P0s up front so the CEO can reference / close / defer them.
  - op: create_bead
    title: "P0-AUTH: SQL-injection in /v1/login parameter handling"
    type: bug
    priority: 0
    id_var: sec_id

  - op: create_bead
    title: "P0-DEMO: ship CSV export endpoint before tomorrow's customer demo"
    type: feature
    priority: 0
    id_var: demo_id

  # OKR carries the full situation. Outcome-only — no command list.
  - op: create_okr
    objective: "Make a defended call between P0-AUTH and P0-DEMO; ship one, hand off the other"
    owner: ceo
    description: |
      Situation
      =========
      Two P0 issues just landed at the same time. Both are real, both have
      real stakeholders, and there is not enough budget or time today to
      do both well.

      P0-AUTH (security / compliance)
      -------------------------------
      A SQL-injection vulnerability has been confirmed in /v1/login.
      Compliance wants a documented patch within today's working window.
      Customer data is not currently leaking but the path is open.

        Deliverable shape (if you ship this one):
          /tmp/canary09-prioritized.py — a Python module that
          demonstrates the parameterized-query fix for a vulnerable
          login function. It must NOT use string concatenation or
          f-strings to build SQL containing user input. Use a
          parameterized query (e.g. cursor.execute(sql, (params,))).

      P0-DEMO (sales / customer)
      --------------------------
      The biggest prospect's procurement team is reviewing tomorrow at
      10am. They asked for CSV export of /v1/orders. If the demo
      doesn't show this working, the deal slips a quarter.

        Deliverable shape (if you ship this one):
          /tmp/canary09-prioritized.py — a Python module exposing a
          function that converts a list of order dicts into a valid
          CSV string with header row and at least one body row.

      Note: only ONE /tmp/canary09-prioritized.py exists. Whichever P0
      you ship, that file IS the deliverable. Don't try to ship both
      in one file — pick.

      Budget reality
      ==============
      You have ~100 credits. A specialist hire costs 30–40 each, and
      doing either deliverable to a real bar takes ~50 credits of focused
      work. Trying to half-ass both is a worse outcome than shipping one
      well and deferring the other cleanly.

      What we need from you (CEO)
      ===========================
      1. Decide WHICH P0 ships today. The other defers.
      2. Write the decision down in /tmp/canary09-decision.md. The memo
         must:
           - Reference BOTH P0-AUTH and P0-DEMO by name.
           - State which one ships and which defers.
           - Give substantive reasoning (cost, risk, customer impact —
             not just "I picked this one"). Words like "because",
             "given", "however", or "since" should appear naturally as
             you defend the call.
      3. Broadcast the tradeoff to #general so stakeholders know what
         to expect today vs. tomorrow.
      4. Execute on the chosen path: the prioritized deliverable file
         lands, and the chosen bead closes with a substantive reason.
      5. The DEFERRED P0 gets a handoff doc at /tmp/canary09-deferred.md
         that names an owner (the worker, by name or role, who will
         pick it up) and an approximate timeframe (e.g. "tomorrow",
         "after demo", "within 24h"). Don't close the deferred bead —
         leave it open so the handoff target can claim it.

      Stakeholder context
      ===================
      Both Compliance and Sales know this is a hard call. They are not
      expecting both today. They ARE expecting a defended decision and
      a clean handoff for whichever side waits.

  - { op: start_org }
  - op: kickstart_ceo
    message: "Two P0s landed at once and the budget doesn't cover both. Read the OKR carefully. Pick which one ships today, write the decision memo at /tmp/canary09-decision.md (mention both P0s by name and defend the call), broadcast to #general, then ship the prioritized deliverable to /tmp/canary09-prioritized.py. The deferred P0 needs a handoff doc at /tmp/canary09-deferred.md naming who picks it up and when."

  # Phase 1: at least one hire. Solo CEO doing it all is the failure mode
  # — we want to see real delegation under pressure, even if minimal.
  - { op: wait_until, predicate: { kind: worker_count, min: 2 }, timeout_seconds: 180, poll_interval_seconds: 5 }

  # Phase 2: decision memo lands first (the gate before execution).
  # Both P0 names must appear — proves the CEO didn't just rubber-stamp one.
  - { op: wait_until, predicate: { kind: file_contains, path: /tmp/canary09-decision.md, substring: "P0-AUTH" }, timeout_seconds: 240, poll_interval_seconds: 5 }
  - { op: wait_until, predicate: { kind: file_contains, path: /tmp/canary09-decision.md, substring: "P0-DEMO" }, timeout_seconds: 240, poll_interval_seconds: 5 }

  # Phase 3: prioritized deliverable lands. We accept either P0's shape.
  # If P0-AUTH won: file mentions parameterized / cursor.execute / placeholders.
  # If P0-DEMO won: file mentions csv / writer / header.
  - op: wait_until
    predicate:
      kind: file_contains_any
      path: /tmp/canary09-prioritized.py
      substrings: ["parameterized", "cursor.execute", "placeholder", "csv", "writer", "writerow"]
      case_insensitive: true
    timeout_seconds: 360
    poll_interval_seconds: 5

  # Phase 4: handoff doc for the deferred P0.
  - { op: wait_until, predicate: { kind: file_contains, path: /tmp/canary09-deferred.md, substring: "" }, timeout_seconds: 240, poll_interval_seconds: 5 }

assertions:
  # CEO did not solo this — at least one hire under pressure.
  - { kind: worker_count, min: 2 }

  # Decision memo names BOTH P0s and reads like a defended choice, not a
  # rubber-stamp. Reasoning markers are the proxy: at least one of these
  # connectives should appear when you're explaining a tradeoff.
  - { kind: file_contains, path: /tmp/canary09-decision.md, substring: "P0-AUTH" }
  - { kind: file_contains, path: /tmp/canary09-decision.md, substring: "P0-DEMO" }
  - kind: file_contains_any
    path: /tmp/canary09-decision.md
    substrings: ["because", "given", "since", "however", "tradeoff", "trade-off", "rationale"]
    case_insensitive: true

  # Prioritized deliverable: either P0's shape is acceptable. We don't
  # care which won — only that something real shipped.
  - kind: file_contains_any
    path: /tmp/canary09-prioritized.py
    substrings: ["parameterized", "cursor.execute", "placeholder", "csv", "writer", "writerow"]
    case_insensitive: true

  # Deferred handoff names a human/role and a rough timeframe. We can't
  # check arbitrary names, so we check for ANY of the structural markers
  # that a real handoff doc has.
  - kind: file_contains_any
    path: /tmp/canary09-deferred.md
    substrings: ["owner", "assigned", "handoff", "tomorrow", "after", "next", "pick up", "engineer", "specialist"]
    case_insensitive: true

  # The chosen P0 must be closed; the deferred one stays open for handoff.
  # We can't assert "exactly one of two is closed" without an or-predicate,
  # so we just assert ≥1 closed by name (sec_id OR demo_id) via a separate
  # predicate. Skipped here to keep the spec minimal — the file checks
  # above are the load-bearing assertions for whether work shipped.
