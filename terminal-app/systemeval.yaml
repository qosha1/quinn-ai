adapter: pytest
project_root: .
test_directory: tests
options:
  # Standard pytest options
  verbose: true

categories:
  # ==========================================================================
  # GATE 1: FOUNDATION TESTS (Must pass before any view work)
  # These test the core interfaces and terminal abstraction layer
  # ==========================================================================

  foundation-interfaces:
    description: "Interface contract tests (OrgConnection, WorkerInfo, etc.)"
    pattern: "test_interfaces.py"

  foundation-terminals:
    description: "Terminal provider tests (registry, Kitty, iTerm, Generic)"
    pattern: "test_terminal_providers.py"

  foundation-config:
    description: "Configuration tests (BoardConfig, explicit injection)"
    pattern: "test_config.py"

  foundation-all:
    description: "ALL foundation tests - GATE 1"
    pattern: "test_{interfaces,terminal_providers,config}.py"

  # ==========================================================================
  # GATE 2: VIEW TESTS (Must pass before integration work)
  # These test individual views in isolation with mocked data
  # ==========================================================================

  view-dashboard:
    description: "Dashboard view unit tests"
    pattern: "test_view_dashboard.py"

  view-okrs:
    description: "OKRs view unit tests"
    pattern: "test_view_okrs.py"

  view-team:
    description: "Team view unit tests"
    pattern: "test_view_team.py"

  view-messages:
    description: "Messages view unit tests"
    pattern: "test_view_messages.py"

  views-all:
    description: "ALL view tests - GATE 2"
    pattern: "test_view_*.py"

  # ==========================================================================
  # GATE 3: INTEGRATION TESTS (Must pass before wizard components)
  # These test org connection and real data flow
  # ==========================================================================

  integration-org-connection:
    description: "OrgConnection implementation tests with real SQLite"
    pattern: "test_org_connection.py"

  integration-org-discovery:
    description: "Org discovery and startup tests"
    pattern: "test_org_discovery.py"

  integration-session-attach:
    description: "Session attachment and window spawning tests"
    pattern: "test_session_attach.py"

  integration-all:
    description: "ALL integration tests - GATE 3"
    pattern: "test_{org_connection,org_discovery,session_attach}.py"

  # ==========================================================================
  # GATE 4: WIDGET/COMPONENT TESTS (Must pass before wizard assembly)
  # These test reusable UI components
  # ==========================================================================

  widget-provider-config:
    description: "Provider configuration widget tests"
    pattern: "test_widget_provider_config.py"

  widget-okr-editor:
    description: "OKR editor widget tests"
    pattern: "test_widget_okr_editor.py"

  widget-ceo-briefing:
    description: "CEO briefing composer tests"
    pattern: "test_widget_ceo_briefing.py"

  widgets-all:
    description: "ALL widget tests - GATE 4"
    pattern: "test_widget_*.py"

  # ==========================================================================
  # GATE 5: E2E TESTS (Must pass before release)
  # Full workflow tests with real orgs
  # ==========================================================================

  e2e-app-launch:
    description: "App launches and displays correctly"
    pattern: "test_e2e_app_launch.py"

  e2e-org-lifecycle:
    description: "Full org init -> start -> interact -> stop workflow"
    pattern: "test_e2e_org_lifecycle.py"

  e2e-board-intervention:
    description: "Board message -> response -> worker notification flow"
    pattern: "test_e2e_board_intervention.py"

  e2e-all:
    description: "ALL E2E tests - GATE 5"
    pattern: "test_e2e_*.py"

  # ==========================================================================
  # AGGREGATE CATEGORIES
  # ==========================================================================

  all:
    description: "ALL tests (single entry point)"
    pattern: "test_*.py"

  pre-commit:
    description: "Fast tests for pre-commit hook (foundation + views)"
    pattern: "test_{interfaces,terminal_providers,config,view_*}.py"

  ci:
    description: "Full CI suite (all except slow E2E)"
    pattern: "test_{interfaces,terminal_providers,config,view_*,org_*,widget_*,session_*}.py"
