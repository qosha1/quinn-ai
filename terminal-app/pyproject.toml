[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quinn-ai-board"
version = "0.2.0"
description = "QuinnAI Board Terminal UI - Interactive oversight for AI organizations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "QuinnAI Team" }
]
keywords = ["ai", "agents", "orchestration", "tui", "textual", "quinn-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.47.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "quinn-ai",
]

[project.urls]
Homepage = "https://github.com/qosha1/quinn-ai"
Repository = "https://github.com/qosha1/quinn-ai"
Issues = "https://github.com/qosha1/quinn-ai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "textual-dev>=1.0.0",
]

[project.scripts]
qn-board = "board_ui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/board_ui"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# For local development, install quinn-ai from parent directory:
# pip install -e .. && pip install -e ".[dev]"
# Or use uv: uv pip install -e .. -e ".[dev]"
