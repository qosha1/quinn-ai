# Worker Templates
# Defines skill, cost, and authority profiles for different worker roles.
#
# Skills: 0-100 score for each capability
#   - coding: Writing and understanding code
#   - reasoning: Complex problem solving and analysis
#   - research: Information gathering and synthesis
#   - management: Coordinating teams and delegating work
#   - strategy: Long-term planning and decision making
#
# Cost: 0-100 score determining model quality
#   - 0-30: Budget models (fast, cheap, limited capability)
#   - 31-60: Standard models (balanced)
#   - 61-80: Advanced models (high capability)
#   - 81-100: Premium models (best available)
#
# Authority: Organizational permissions
#   - can_hire: Can create new worker positions
#   - can_fire: Can terminate workers
#   - can_delegate: Can delegate budget to reports
#   - budget_limit: Maximum budget that can be held (null = unlimited)
#   - escalation_path: Default escalation chain

templates:
  # Executive roles - high cost, strategic focus
  ceo:
    description: "Chief Executive Officer - strategic leadership"
    skills:
      coding: 40
      reasoning: 90
      research: 70
      management: 95
      strategy: 100
    cost: 100
    authority:
      can_hire: true
      can_fire: true
      can_delegate: true
      budget_limit: null  # Unlimited
      escalation_path: [board]

  director:
    description: "Director level - department leadership"
    skills:
      coding: 50
      reasoning: 85
      research: 75
      management: 85
      strategy: 80
    cost: 85
    authority:
      can_hire: true
      can_fire: true
      can_delegate: true
      budget_limit: 10000
      escalation_path: [ceo, board]

  # Management roles - balanced cost, coordination focus
  manager:
    description: "Manager - team coordination and delivery"
    skills:
      coding: 60
      reasoning: 75
      research: 70
      management: 80
      strategy: 60
    cost: 70
    authority:
      can_hire: true
      can_fire: false
      can_delegate: true
      budget_limit: 5000
      escalation_path: [director, ceo, board]

  lead:
    description: "Tech lead - technical leadership"
    skills:
      coding: 90
      reasoning: 85
      research: 75
      management: 70
      strategy: 50
    cost: 75
    authority:
      can_hire: false
      can_fire: false
      can_delegate: true
      budget_limit: 2000
      escalation_path: [manager, director, ceo, board]

  # Individual contributor roles - varied cost based on seniority
  senior_engineer:
    description: "Senior engineer - high capability IC"
    skills:
      coding: 95
      reasoning: 85
      research: 80
      management: 40
      strategy: 40
    cost: 70
    authority:
      can_hire: false
      can_fire: false
      can_delegate: false
      budget_limit: 1000
      escalation_path: [lead, manager, director, ceo, board]

  engineer:
    description: "Engineer - standard IC"
    skills:
      coding: 80
      reasoning: 70
      research: 65
      management: 25
      strategy: 25
    cost: 50
    authority:
      can_hire: false
      can_fire: false
      can_delegate: false
      budget_limit: 500
      escalation_path: [senior_engineer, lead, manager, director, ceo, board]

  junior_engineer:
    description: "Junior engineer - learning IC"
    skills:
      coding: 60
      reasoning: 55
      research: 50
      management: 15
      strategy: 15
    cost: 30
    authority:
      can_hire: false
      can_fire: false
      can_delegate: false
      budget_limit: 200
      escalation_path: [engineer, senior_engineer, lead, manager, director, ceo, board]

  # Specialist roles
  researcher:
    description: "Researcher - information synthesis"
    skills:
      coding: 50
      reasoning: 90
      research: 95
      management: 30
      strategy: 60
    cost: 65
    authority:
      can_hire: false
      can_fire: false
      can_delegate: false
      budget_limit: 1000
      escalation_path: [lead, manager, director, ceo, board]

  analyst:
    description: "Analyst - data and business analysis"
    skills:
      coding: 65
      reasoning: 85
      research: 85
      management: 35
      strategy: 55
    cost: 55
    authority:
      can_hire: false
      can_fire: false
      can_delegate: false
      budget_limit: 500
      escalation_path: [manager, director, ceo, board]
