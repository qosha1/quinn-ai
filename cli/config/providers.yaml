# Provider Configuration
# Defines which AI providers are authorized and their settings.
#
# Environment variables can be used with ${VAR_NAME} syntax.
# API keys should never be committed - use environment variables.

# Default provider used when no preference specified
default: claude_code

# Authorized providers - which providers the org can use
authorized_providers:
  - claude_code
  - anthropic
  - openai

# Available providers
providers:
  claude_code:
    enabled: true
    api_key: "not-needed-uses-system-auth"
    timeout: 60
    max_retries: 3

  anthropic:
    enabled: false
    api_key: ${ANTHROPIC_API_KEY}
    timeout: 60
    max_retries: 3

  openai:
    enabled: false
    api_key: ${OPENAI_API_KEY}
    timeout: 60
    max_retries: 3

# Model selection thresholds
# These determine when specific capabilities are required based on worker skills
thresholds:
  # Skill score above which coding capability is required
  coding: 80
  # Skill score above which reasoning capability is required
  reasoning: 60
  # Skill score above which research capability is required
  research: 80

# Cost tiers mapping - maps skill levels to model tiers
cost_tiers:
  0-20:
    tier: "economy"
    max_cost_per_request: 0.01
  21-50:
    tier: "standard"
    max_cost_per_request: 0.05
  51-80:
    tier: "premium"
    max_cost_per_request: 0.20
  81-100:
    tier: "enterprise"
    max_cost_per_request: 1.00

# Model specifications
models:
  anthropic:
    claude-sonnet-4-20250514:
      context_window: 200000
      output_tokens: 64000
      capabilities:
        - vision
        - function_calling
        - code_interpreter
      cost_per_1k_input: 0.003
      cost_per_1k_output: 0.015
      tier: standard

    claude-opus-4-20250514:
      context_window: 200000
      output_tokens: 32000
      capabilities:
        - vision
        - function_calling
        - code_interpreter
        - extended_thinking
      cost_per_1k_input: 0.015
      cost_per_1k_output: 0.075
      tier: enterprise

  openai:
    gpt-4o:
      context_window: 128000
      output_tokens: 16384
      capabilities:
        - vision
        - function_calling
      cost_per_1k_input: 0.005
      cost_per_1k_output: 0.015
      tier: standard

    gpt-5:
      context_window: 256000
      output_tokens: 32000
      capabilities:
        - vision
        - function_calling
        - reasoning
      cost_per_1k_input: 0.01
      cost_per_1k_output: 0.03
      tier: premium
      temperature: 1.0  # Required for gpt-5

# Fallback configuration
fallback:
  enabled: true
  order:
    - preferred_provider
    - default_provider
    - any_authorized
  retry_count: 3
  retry_delay_ms: 1000
