[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quinnai-cli"
version = "0.1.0"
description = "QuinnAI organization management CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "QuinnAI Team" }
]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
qn = "commands.main:qn"

[tool.hatch.build.targets.wheel]
packages = ["core", "providers", "commands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
